services:
  postgres:
    image: postgres:16-alpine
    container_name: lavadero-bi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-lavadero_bi}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-lavadero_bi}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lavadero-bi-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_ADDR: ":8000"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_dev_password}@postgres:5432/${POSTGRES_DB:-lavadero_bi}?sslmode=disable"
      JWT_SECRET: "${JWT_SECRET:-secreto_desarrollo_docker_al_menos_32_caracteres}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-2.5-flash}"
      WHATSAPP_ENABLED: "${WHATSAPP_ENABLED:-true}"
      WHATSAPP_GATEWAY_URL: "${WHATSAPP_GATEWAY_URL:-http://whatsapp-gateway:8080}"
      WHATSAPP_API_KEY: "${WHATSAPP_API_KEY:-triton_secret_wa_api_key_2026}"
      WHATSAPP_INSTANCE_NAME: "${WHATSAPP_INSTANCE_NAME:-triton}"
    ports:
      - "8000:8000"

  whatsapp-gateway:
    image: evoapicloud/evolution-api:v2.2.3
    container_name: lavadero-bi-evolution-api
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      AUTHENTICATION_API_KEY: "${WHATSAPP_API_KEY:-triton_secret_wa_api_key_2026}"
      DATABASE_ENABLED: "false"
      CONFIG_SESSION_PHONE_CLIENT: "TRITÓN Lavadero"
      CONFIG_SESSION_PHONE_NAME: "Chrome"
      WEBHOOK_GLOBAL_URL: "http://backend:8000/api/webhooks/whatsapp"
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
    ports:
      - "8080:8080"
    volumes:
      - evolution_instances:/evolution/instances

volumes:
  pgdata:
  evolution_instances:

